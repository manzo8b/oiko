<!doctype html>
<html lang="it">
<head>

<body>
  <div class="app-shell" id="app">
    <aside class="sidebar" aria-label="Navigazione principale">
      <a href="#oggi" class="brand" aria-label="Oiko, vai alla panoramica"><img class="brand-logo" src="./assets/logo.svg" alt="" width="42" height="42"><span>Oiko</span></a>
      <p class="side-caption">LA TUA CASA È OK</p>
      <nav id="side-nav" aria-label="Sezioni"></nav>
