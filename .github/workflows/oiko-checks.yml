name: Oiko Solo — release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, packaging and release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all tests (including local-data smoke tests)
        run: npm test
      - name: Verify release policy without unlocking Family
        run: npm run release:check
