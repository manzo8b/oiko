name: Oiko QA
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check assets/app.mjs
      - run: node --check assets/db.mjs
      - run: node --check assets/logic.mjs
